esphome:
  name: spa-controller
  friendly_name: "Spa Controller"
  platformio_options:
    board_build.flash_mode: dio

esp32:
  board: um_pros3
  framework:
    type: esp-idf

psram:
  mode: quad
  speed: 80MHz

# Enable logging
logger:
  level: INFO

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Spa-Control Fallback Hotspot"
    password: !secret ap_password

captive_portal:

external_components:
  - source:
      type: git
      url: https://github.com/wolfson292/iq2020
      ref: main
    components: [iq2020]
    # ESPHome caches the clone for a day by default, which will happily build
    # from a stale checkout after you push. Keep this short while tracking main.
    refresh: 1min

uart:
  id: uart_spa
  tx_pin: GPIO16
  rx_pin: GPIO15
  baud_rate: 38400
  #debug:
  #  direction: BOTH

iq2020:
  uart_id: uart_spa
  setup_priority: -100
  update_interval: 5s
  id: comp_iq2020
  simulate_music: true
  on_music_volume_up:
     - logger.log: "Music Volume Up"


button:
  - platform: iq2020
    iq2020_id: comp_iq2020
    reset:
      name: "Reset IQ2020"
    # Starts the salt module's water test, the same as the panel's test button.
    swg_test:
      name: "SWG Water Test"
    # Tells the controller it may transmit. Changes nothing; safe to press
    # if the bus looks stuck.
    transmit_nudge:
      name: "Transmit Nudge"

text:
  - platform: iq2020
    iq2020_id: comp_iq2020
    mode: text
    type: "artist"
    name: "Artist"
  - platform: iq2020
    iq2020_id: comp_iq2020
    mode: text
    type: "song"
    name: "Song"

sensor:
  - platform: iq2020
    iq2020_id: comp_iq2020
    temp_set:
      name: "Set Temp"
    high_limit_temp:
      name: "Heater Output Temp"
    water_temp:
      name: "Water Temp"
    pcb_temp:
      name: "PCB Temp"

    swg_age:
      name: "SWG Cartridge Age"
      id: swg_age
    swg_error:
      name: "SWG Error Code"
      id: swg_error
    swg_output_level:
      name: "SWG Output Level"
    swg_salt_test:
      name: "SWG Salt Test"
    swg_cell_state:
      name: "SWG Cell State"
    swg_salinity:
      name: "SWG Salinity"
    swg_salinity_index:
      name: "SWG Salinity Index"
    swg_cell_runtime:
      name: "SWG Cell Runtime"
    swg_spa_size:
      name: "SWG Spa Size"
    
    l1_power:
      name: "L1 Power"
    l2_power:
      name: "L2 Power"
    jets3_power:
      name: "Jets3 Power"
    heater_power:
      name: "Heater Power"
    
    heater_seconds:
      name: "Heater Runtime"
    jet1_seconds:
      name: "Jets 1 Runtime"
    jet2_seconds:
      name: "Jets 2 Runtime"
    jet3_seconds:
      name: "Jets 3 Runtime"
    blower_seconds:
      name: "Blower Runtime"
    lights_seconds:
      name: "Lights Runtime"
    pump_seconds:
      name: "Pump Runtime"
    jet1_low_seconds:
      name: "Jets 1 Low Runtime"
    jet2_low_seconds:
      name: "Jets 2 Low Runtime"
    lifetime_seconds:
      name: "Lifetime Runtime"
    
    lost_lines:
      name: "Lost Line Counter"

    jets1_speed:
      name: "Jets 1 Speed"
    jets2_speed:
      name: "Jets 2 Speed"
    jets3_speed:
      name: "Jets 3 Speed"
    blower_speed:
      name: "Blower Speed"

    heater_current:
      name: "Heater Current"
    l1_current:
      name: "L1 Current"
    l2_current:
      name: "L2 Current"
    jets3_current:
      name: "Jets 3 Current"
    periph_current:
      name: "Periph Current"

    heater_voltage:
      name: "Heater Voltage"
    l1_voltage:
      name: "L1 Voltage"
    l2_voltage:
      name: "L2 Voltage"
    jets3_voltage:
      name: "Jets 3 Voltage"

    rtc_seconds:
      name: "RTC Seconds"
      filters:
        - throttle: 60s
    rtc_minutes:
      name: "RTC Minutes"
    rtc_hours:
      name: "RTC Hours"
    rtc_days:
      name: "RTC Days"
    rtc_years:
      name: "RTC Years"

    jets1_timeout:
      name: "Jets 1 Timeout"
    jets2_timeout:
      name: "Jets 2 Timeout"
    jets3_timeout:
      name: "Jets3 Timeout"
    blower_timeout:
      name: " Blower Timeout"
    lights_timeout:
      name: "Lights Timeout"
    daily_clean_cycle:
      name: "Daily Clean Cycle"

binary_sensor:
  - platform: iq2020
    summer_timer:
      name: "Summer Timer"
    spa_lock:
      name: "Spa Lock"
    temp_lock:
      name: "Temp Lock"
    clean_lock:
      name: "Clean Lock"
    pump:
      name: "Pump"
    swg_generating:
      name: "SWG Generating"
    swg_boost:
      name: "SWG Boost Cycle"
    swg_cartridge_due:
      name: "SWG Cartridge Due"
    swg_cartridge_present:
      name: "SWG Cartridge Present"
    swg_level_locked:
      name: "SWG Level Locked"
    econ_mode:
      name: "Econ Mode"
    circulation:
      name: "Circulation"

  
datetime:
  - platform: iq2020
    rtc:
      name: "RTC"



text_sensor:
  - platform: iq2020
    iq2020_id: comp_iq2020
    iq2020_debug:
      name: "IQ2020 Debug"
    iq2020_version_controller:
      name: "Controller Version"
    iq2020_version_display:
      name: "Display Version"
    iq2020_version_other_a:
      name: "OtherA Version"
    iq2020_version_other_b:
      name: "OtherB Version"
    spa_state:
      name: "Spa State"
    light_state:
      name: "Light State"
    swg_status:
      name: "SWG Status"
    swg_type:
      name: "SWG Type"
    rtc_status:
      name: "RTC Status"
    #rtc:
    #  name: "RTC Timestamp"


switch:
  - platform: iq2020
    iq2020_id: comp_iq2020
    clean_mode:
      name: "Clean Mode"
      id: clean_mode
    jets1:
      name: "Jets 1"
    # Jets 2 and 3 and the blower exist on larger spas. Leave them out if your
    # spa does not have them - the controller answers 0 for anything it is not
    # configured for, so they would simply sit at off.
    jets2:
      name: "Jets 2"
    jets3:
      name: "Jets 3"
    blower:
      name: "Blower"
    # Config-category switches: these mirror the panel's lock and timer options.
    summer_timer:
      name: "Summer Timer"
    spa_lock:
      name: "Spa Lock"
    temp_lock:
      name: "Temp Lock"
    # 24-hour boost cycle on the salt module.
    swg_boost:
      name: "SWG Boost Cycle"
    # Raw frame capture for protocol work - see docs/capturing.md.
    # Off by default and always restores off.
    capture:
      name: "Bus Capture"
  - platform: gpio
    pin: GPIO17
    name: "LDO2"

number:
  - platform: iq2020
    iq2020_id: comp_iq2020
    swg_level:
      name: "SWG Level"
      id: swg_level


climate:
  - platform: iq2020
    iq2020_id: comp_iq2020
    name: "Heater"

light:
  - platform: iq2020
    iq2020_id: comp_iq2020
    light_num: 0
    name: "Underwater"
  - platform: iq2020
    iq2020_id: comp_iq2020
    light_num: 1
    name: "Bartop"
  - platform: iq2020
    iq2020_id: comp_iq2020
    light_num: 2
    name: "Pillow"
  - platform: iq2020
    iq2020_id: comp_iq2020
    light_num: 3
    name: "Exterior"
  - platform: iq2020
    iq2020_id: comp_iq2020
    light_num: 4
    name: "All"
  - platform: esp32_rmt_led_strip
    id: led_ring
    name: "Debug LED"
    pin: GPIO18
    num_leds: 1
    rgb_order: GRB
    chipset: ws2812
    
time:
  - platform: homeassistant
    id: homeassistant_time
    on_time:
      - seconds: 0
        minutes: 00
        hours: 11
        then:
          - switch.turn_on: clean_mode
